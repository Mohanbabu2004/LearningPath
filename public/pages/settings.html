<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - LearningPath</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7);
            --sidebar-bg: #111827;
        }

        body.light-theme {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --border-color: #e5e7eb;
            --text-color: #111827;
            --text-muted: #6b7280;
            --accent-color: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #4f46e5, #7c3aed);
            --sidebar-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-nav {
            background: var(--sidebar-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #6366f1;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-nav-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* Settings Layout */
        .settings-layout {
            display: flex;
            max-width: 1200px;
            margin: 30px auto;
            width: 95%;
            gap: 30px;
            flex: 1;
        }

        /* Hierarchy / Nav Sidebar */
        .settings-sidebar {
            width: 280px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            height: fit-content;
        }

        .sidebar-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tree Structure representation */
        .tree-menu {
            list-style: none;
            padding-left: 5px;
        }

        .tree-menu-item {
            margin-bottom: 8px;
            position: relative;
        }

        .tree-menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tree-menu-link:hover, .tree-menu-link.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-color);
        }

        .tree-connector {
            font-family: monospace;
            color: var(--text-muted);
            margin-right: 4px;
        }

        /* Content Area */
        .settings-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .settings-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(10px);
            scroll-margin-top: 30px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h2 {
            font-size: 20px;
            font-weight: 600;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.1);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        body.light-theme .form-control {
            background: #f9fafb;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        /* Radio Group for Theme */
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            flex: 1;
            transition: all 0.2s ease;
        }

        .radio-option:hover {
            border-color: var(--accent-color);
        }

        .radio-option input[type="radio"] {
            accent-color: var(--accent-color);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Checkbox Group for Notifications */
        .checkbox-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 15px;
            color: var(--text-color);
        }

        .checkbox-option input[type="checkbox"] {
            accent-color: var(--accent-color);
            width: 20px;
            height: 20px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Action Buttons */
        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideUp 0.3s ease forwards;
            z-index: 1000;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 850px) {
            .settings-layout {
                flex-direction: column;
            }
            .settings-sidebar {
                width: 100%;
            }
            .radio-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="top-nav">
        <a href="home.html" class="logo">
            🚀 LearningPath
        </a>
        <div class="user-nav-info">
            <a href="learn/profile.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px;">
                <div class="user-avatar">M</div>
                <span style="font-weight: 500;">Mohan</span>
            </a>
        </div>
    </header>

    <!-- Main Settings Container -->
    <div class="settings-layout">

        <!-- Hierarchy Tree Navigation Sidebar -->
        <aside class="settings-sidebar">
            <div class="sidebar-title">
                ⚙️ Settings
            </div>
            
            <ul class="tree-menu">
                <li class="tree-menu-item">
                    <a href="#profileSection" class="tree-menu-link active" onclick="setActiveTab(this)">
                        <span class="tree-connector">├──</span> 👤 Profile
                    </a>
                </li>
                <li class="tree-menu-item">
                    <a href="#appearanceSection" class="tree-menu-link" onclick="setActiveTab(this)">
                        <span class="tree-connector">├──</span> 🎨 Appearance
                    </a>
                </li>
                <li class="tree-menu-item">
                    <a href="#notificationsSection" class="tree-menu-link" onclick="setActiveTab(this)">
                        <span class="tree-connector">├──</span> 🔔 Notifications
                    </a>
                </li>
                <li class="tree-menu-item">
                    <a href="#logoutSection" class="tree-menu-link" onclick="setActiveTab(this)">
                        <span class="tree-connector">└──</span> 🚪 Logout
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Settings Content Panels -->
        <main class="settings-content">

            <!-- Profile Section -->
            <section id="profileSection" class="settings-card">
                <div class="card-header">
                    <span style="font-size: 24px;">👤</span>
                    <h2>Profile</h2>
                </div>
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" class="form-control" value="Mohan">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" value="user@example.com">
                </div>

                <button class="btn-primary" onclick="saveProfile()">
                    💾 Save Profile
                </button>
            </section>

            <!-- Appearance Section -->
            <section id="appearanceSection" class="settings-card">
                <div class="card-header">
                    <span style="font-size: 24px;">🎨</span>
                    <h2>Appearance</h2>
                </div>

                <div class="form-group">
                    <label>Theme</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="theme" value="dark" id="themeDark" onchange="toggleTheme('dark')" checked>
                            <span>🌙 Dark</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="theme" value="light" id="themeLight" onchange="toggleTheme('light')">
                            <span>☀️ Light</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Notifications Section -->
            <section id="notificationsSection" class="settings-card">
                <div class="card-header">
                    <span style="font-size: 24px;">🔔</span>
                    <h2>Notifications</h2>
                </div>

                <div class="checkbox-list">
                    <label class="checkbox-option">
                        <input type="checkbox" id="quizReminders" checked onchange="saveNotifications()">
                        <span>Quiz reminders</span>
                    </label>

                    <label class="checkbox-option">
                        <input type="checkbox" id="courseUpdates" checked onchange="saveNotifications()">
                        <span>Course updates</span>
                    </label>

                    <label class="checkbox-option">
                        <input type="checkbox" id="projectNotifications" onchange="saveNotifications()">
                        <span>Project notifications</span>
                    </label>
                </div>
            </section>

            <!-- Logout Section -->
            <section id="logoutSection" class="settings-card">
                <div class="card-header">
                    <span style="font-size: 24px;">🚪</span>
                    <h2>Logout</h2>
                </div>

                <p style="color: var(--text-muted); margin-bottom: 20px;">
                    Sign out of your LearningPath account on this device.
                </p>

                <button class="btn-danger" onclick="confirmLogout()">
                    🚪 Logout Account
                </button>
            </section>

        </main>
    </div>

    <!-- Toast Banner -->
    <div id="toast" class="toast">
        ✅ Settings saved successfully!
    </div>

    <script>
        // Set Active Tree Link
        function setActiveTab(element) {
            document.querySelectorAll('.tree-menu-link').forEach(link => link.classList.remove('active'));
            element.classList.add('active');
        }

        // Toggle Theme
        function toggleTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-theme');
                localStorage.setItem('theme', 'dark');
            }
            showToast('Theme updated to ' + theme.toUpperCase());
        }

        // Save Profile
        function saveProfile() {
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            
            if (name) localStorage.setItem('learningName', name);
            if (email) localStorage.setItem('learningEmail', email);

            showToast('Profile saved successfully!');
        }

        // Save Notifications
        function saveNotifications() {
            const quizReminders = document.getElementById('quizReminders').checked;
            const courseUpdates = document.getElementById('courseUpdates').checked;
            const projectNotifications = document.getElementById('projectNotifications').checked;

            localStorage.setItem('quizReminders', quizReminders);
            localStorage.setItem('courseUpdates', courseUpdates);
            localStorage.setItem('projectNotifications', projectNotifications);

            showToast('Notification preferences updated!');
        }

        // Show Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = '✅ ' + message;
            toast.style.display = 'flex';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }

        // Confirm Logout
        function confirmLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('learningPathUser');
                window.location.href = 'learn/login.html';
            }
        }

        // Initialize saved settings on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Saved Theme
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.getElementById('themeLight').checked = true;
                document.body.classList.add('light-theme');
            } else {
                document.getElementById('themeDark').checked = true;
            }

            // Saved Profile
            const savedName = localStorage.getItem('learningName');
            if (savedName) document.getElementById('fullName').value = savedName;

            const savedEmail = localStorage.getItem('learningEmail');
            if (savedEmail) document.getElementById('email').value = savedEmail;

            // Saved Notifications
            if (localStorage.getItem('quizReminders') !== null) {
                document.getElementById('quizReminders').checked = localStorage.getItem('quizReminders') === 'true';
            }
            if (localStorage.getItem('courseUpdates') !== null) {
                document.getElementById('courseUpdates').checked = localStorage.getItem('courseUpdates') === 'true';
            }
            if (localStorage.getItem('projectNotifications') !== null) {
                document.getElementById('projectNotifications').checked = localStorage.getItem('projectNotifications') === 'true';
            }
        });
    </script>
</body>
</html>
