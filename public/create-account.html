<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f29">
  <title>Create Account | LearningPath</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ========================================================
       Create Account - Exact Match to Reference Design
       (media_1791956006373_89656fc6.png)
       ======================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.create-acc-page {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 20%, #172554 0%, #0a0f29 60%, #030712 100%);
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
    }

    /* Outer Glow Frame Bezel */
    .create-acc-bezel-frame {
      width: 100%;
      max-width: 430px;
      border: 2px solid #3b82f6;
      border-radius: 28px;
      background: #090e29;
      box-shadow: 
        0 0 25px rgba(59, 130, 246, 0.45),
        0 0 60px rgba(139, 92, 246, 0.25),
        inset 0 0 15px rgba(59, 130, 246, 0.2);
      overflow: hidden;
      position: relative;
      margin: 0 auto;
    }

    /* Top Step 2 Bezel Header */
    .bezel-top-banner {
      background: linear-gradient(90deg, #1e40af 0%, #2563eb 50%, #1d4ed8 100%);
      padding: 13px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.15);
    }

    .step-circle-badge {
      position: absolute;
      left: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d946ef 0%, #a855f7 50%, #7c3aed 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 800;
      border: 2.5px solid #ffffff;
      box-shadow: 0 0 12px rgba(217, 70, 239, 0.6);
    }

    .bezel-title-text {
      color: #ffffff;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* Inner Crisp White Card */
    .create-card-white {
      background: #ffffff;
      padding: 24px 24px 22px;
      text-align: center;
    }

    /* Brand Logo */
    .card-brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 14px;
    }

    .cap-svg-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }

    .brand-text-label {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-text-label .part-learn {
      color: #0f172a;
    }

    .brand-text-label .part-path {
      color: #8b5cf6;
    }

    /* Headings */
    .card-heading-title {
      font-size: 23px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
      letter-spacing: -0.4px;
    }

    .card-subtitle-desc {
      font-size: 13.5px;
      color: #64748b;
      margin-bottom: 20px;
      font-weight: 500;
    }

    /* Form Fields */
    .form-fields-stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
      text-align: left;
    }

    .form-input-card {
      background: #ffffff;
      border: 1.5px solid #dbeafe;
      border-radius: 12px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .form-input-card:focus-within {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: #ffffff;
    }

    .input-icon-glyph {
      font-size: 17px;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      flex-shrink: 0;
      user-select: none;
    }

    .input-field-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .field-tag-label {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      margin-bottom: 1px;
      line-height: 1.2;
    }

    .form-input-card input,
    .form-input-card select {
      border: none;
      outline: none;
      background: transparent;
      font-size: 14.5px;
      font-weight: 600;
      color: #0f172a;
      width: 100%;
      font-family: inherit;
      padding: 0;
      margin: 0;
    }

    .form-input-card input::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    /* Custom Gender Select */
    .field-select {
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
    }

    .select-chevron-icon {
      color: #64748b;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      margin-left: auto;
    }

    /* Show password eye button */
    .eye-toggle-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }

    .eye-toggle-btn:hover {
      color: #2563eb;
    }

    /* Password Requirements - 4 Green Circles with checkmarks */
    .password-rules-box {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
    }

    .rule-item-row {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      color: #475569;
      font-weight: 600;
    }

    .rule-check-circle {
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #10b981;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .rule-item-row.invalid .rule-check-circle {
      background: #e2e8f0;
      color: #94a3b8;
    }

    /* Form Message Alert */
    .form-message-alert {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-height: 18px;
    }

    /* Big Blue Submit Button */
    .btn-create-account-blue {
      width: 100%;
      background: #1d4ed8;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 13.5px 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
      transition: all 0.2s ease;
      margin-top: 14px;
      margin-bottom: 14px;
    }

    .btn-create-account-blue:hover {
      background: #1e40af;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(29, 78, 216, 0.45);
    }

    /* Bottom Link: Already have an account? Login */
    .bottom-login-prompt {
      font-size: 14px;
      color: #1e293b;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .bottom-login-prompt a {
      color: #1d4ed8;
      font-weight: 700;
      text-decoration: underline;
      transition: color 0.15s;
    }

    .bottom-login-prompt a:hover {
      color: #1e40af;
    }

    .bottom-back-home {
      display: inline-block;
      margin-top: 16px;
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: color 0.15s;
    }

    .bottom-back-home:hover {
      color: #60a5fa;
    }
  </style>
</head>

<body class="create-acc-page">

  <!-- Outer Neon Glow Frame Bezel -->
  <div class="create-acc-bezel-frame">

    <!-- Top Bezel Banner: (2) Create Account -->
    <div class="bezel-top-banner">
      <div class="step-circle-badge">2</div>
      <span class="bezel-title-text">Create Account</span>
    </div>

    <!-- Inner White Card Matching Screenshot -->
    <div class="create-card-white">

      <!-- Logo: Blue Cap 🎓 + LearningPath -->
      <a href="index.html" class="card-brand-logo">
        <svg class="cap-svg-icon" viewBox="0 0 24 24" fill="#2563eb">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
        </svg>
        <span class="brand-text-label">
          <span class="part-learn">Learning</span><span class="part-path">Path</span>
        </span>
      </a>

      <!-- Heading -->
      <h2 class="card-heading-title">Create Your Account</h2>
      <p class="card-subtitle-desc">Start your learning journey</p>

      <!-- Form -->
      <form id="signupForm" novalidate>
        <div class="form-fields-stack">

          <!-- 1. Full Name -->
          <div class="form-input-card">
            <span class="input-icon-glyph">👤</span>
            <div class="input-field-body">
              <label for="fullName" class="field-tag-label">Full Name</label>
              <input id="fullName" name="fullName" type="text" placeholder="Mohan Babu" autocomplete="name" required minlength="3">
            </div>
          </div>

          <!-- 2. Email Address -->
          <div class="form-input-card">
            <span class="input-icon-glyph">✉</span>
            <div class="input-field-body">
              <label for="email" class="field-tag-label">Email Address</label>
              <input id="email" name="email" type="email" placeholder="mohan@example.com" autocomplete="email" required>
            </div>
          </div>

          <!-- 3. Gender Dropdown -->
          <div class="form-input-card">
            <span class="input-icon-glyph">👤</span>
            <div class="input-field-body">
              <label for="gender" class="field-tag-label">Gender</label>
              <select id="gender" name="gender" class="field-select" required>
                <option value="Male" selected>Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <span class="select-chevron-icon">▼</span>
          </div>

          <!-- 4. Password -->
          <div class="form-input-card">
            <span class="input-icon-glyph">🔒</span>
            <div class="input-field-body">
              <label for="password" class="field-tag-label">Password</label>
              <input id="password" name="password" type="password" placeholder="••••••••••••" autocomplete="new-password" required>
            </div>
            <button type="button" class="eye-toggle-btn show-password" data-target="password" aria-label="Show password">👁</button>
          </div>

          <!-- 5. Confirm Password -->
          <div class="form-input-card">
            <span class="input-icon-glyph">🔒</span>
            <div class="input-field-body">
              <label for="confirmPassword" class="field-tag-label">Confirm Password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="••••••••••••" autocomplete="new-password" required>
            </div>
            <button type="button" class="eye-toggle-btn show-password" data-target="confirmPassword" aria-label="Show confirm password">👁</button>
          </div>

        </div>

        <!-- Password Requirements with 4 Green Checkmarks -->
        <div class="password-rules-box" aria-live="polite">
          <div class="rule-item-row" id="ruleLength">
            <span class="rule-check-circle">✔</span>
            <span>At least 8 characters</span>
          </div>
          <div class="rule-item-row" id="ruleNumber">
            <span class="rule-check-circle">✔</span>
            <span>Include a number</span>
          </div>
          <div class="rule-item-row" id="ruleSpecial">
            <span class="rule-check-circle">✔</span>
            <span>Include a special character</span>
          </div>
          <div class="rule-item-row" id="ruleUpper">
            <span class="rule-check-circle">✔</span>
            <span>Include one capital letter</span>
          </div>
        </div>

        <!-- Form Status Message -->
        <p id="formMessage" class="form-message-alert" role="status" aria-live="polite"></p>

        <!-- Big Blue Create an Account Button -->
        <button type="submit" class="btn-create-account-blue">
          Create an Account →
        </button>
      </form>

      <!-- Bottom Login Link -->
      <p class="bottom-login-prompt">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>
  </div>

  <a href="index.html" class="bottom-back-home">← Back to Home</a>

  <script src="script.js"></script>
</body>
</html>
