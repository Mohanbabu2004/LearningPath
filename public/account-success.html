<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030821">
  <title>Account Created Successfully | LearningPath</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="account-page success-page">

  <main class="success-wrapper">
    <section class="success-card">

      <div class="success-step">
        <span class="step-number">2</span>
        <h1>2. Account Created</h1>
      </div>

      <a href="index.html" class="success-brand">
        <span class="success-logo" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span>Learning<span class="pink">Path</span></span>
      </a>

      <div class="celebration" aria-hidden="true">
        <span class="spark spark-1">✦</span>
        <span class="spark spark-2">✧</span>
        <span class="spark spark-3">✦</span>
        <span class="spark spark-4">✳</span>
        <span class="spark spark-5">✦</span>
        <span class="spark spark-6">✧</span>
        <span class="spark spark-7">✦</span>
        <span class="spark spark-8">✳</span>
        <span class="spark spark-9">✦</span>
        <span class="spark spark-10">✧</span>
      </div>

      <div class="success-content">
        <div class="success-check" aria-label="Success">
          <svg viewBox="0 0 100 100" role="img"
            aria-label="Check mark">
            <path d="M23 51 L42 70 L78 31"
              fill="none" stroke="white"
              stroke-width="10"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </div>

        <h2>Account Created Successfully!</h2>

        <p class="success-description">
          You can now login to continue<br class="desktop-break">
          your learning journey.
        </p>

        <a href="login.html" class="success-login-btn">
          Go to Login <span>→</span>
        </a>
      </div>

      <div class="success-decoration" aria-hidden="true">
        <div class="plant">
          <span></span><span></span><span></span>
          <span></span><span></span><span></span>
          <div class="plant-pot"></div>
        </div>

        <div class="student-scene">
          <div class="student-head">
            <div class="student-hair"></div>
            <div class="student-face">
              <span class="eye eye-left"></span>
              <span class="eye eye-right"></span>
              <span class="smile"></span>
            </div>
          </div>

          <div class="student-body">
            <span class="hood-string hood-string-left"></span>
            <span class="hood-string hood-string-right"></span>
          </div>

          <div class="laptop">
            <span>✓</span>
          </div>
        </div>
      </div>

      <p class="success-bottom">
        Keep learning. Keep growing. 🚀
      </p>

    </section>
  </main>

</body>
</html>
