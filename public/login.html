<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - LearningPath</title>

    <link rel="stylesheet" href="../style.css">

    <style>

        .login-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            font-size: 55px;
        }

        .login-header h1 {
            margin: 10px 0;
            font-size: 32px;
        }

        .login-header p {
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .forgot-link {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot-link a {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .login-container {
                margin: 30px auto;
            }

            .login-card {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- Navbar -->

    <header>

        <nav class="navbar">

            <div class="logo">
                🚀 LearningPath
            </div>

            <button
                class="menu-btn"
                onclick="toggleMenu()"
            >
                ☰
            </button>

            <ul
                class="nav-menu"
                id="navMenu"
            >

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="roadmap.html">
                        Roadmap
                    </a>
                </li>

                <li>
                    <a href="continue-learning.html">
                        Continue Learning
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Login -->

    <main class="login-container">

        <section class="login-card">


            <div class="login-header">

                <div class="login-icon">
                    🔐
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Login to continue your LearningPath journey.
                </p>

            </div>


            <form
                id="loginForm"
                onsubmit="loginUser(event)"
            >


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="forgot-link">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    🔐 Login
                </button>


                <div
                    class="message"
                    id="message"
                ></div>


            </form>


            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>


        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 LearningPath | Learn Coding the Easy Way
        </p>

    </footer>


    <script src="../script.js"></script>

    <script>

        function loginUser(event) {

            event.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const password =
                document.getElementById(
                    "password"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


            if (
                email === ""
                ||
                password === ""
            ) {

                message.style.display = "block";

                message.style.background = "#fee2e2";

                message.style.color = "#991b1b";

                message.textContent =
                    "Please enter email and password.";

                return;

            }


            /*
             * Frontend demonstration only.
             *
             * Real authentication will be connected
             * to the backend and database later.
             */

            message.style.display = "block";

            message.style.background = "#dcfce7";

            message.style.color = "#166534";

            message.textContent =
                "Login form submitted successfully. "
                + "Real authentication will be connected later.";

        }

    </script>


</body>

</html>
